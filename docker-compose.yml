
services:
  touchdown-sim:
    build: .
    container_name: touchdown-sim

    environment:
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
      - GAZEBO_MODEL_PATH=/workspace/touchdown_ws/src/worlds/models
      - GAZEBO_PLUGIN_PATH=/workspace/touchdown_ws/install/lander_sim/lib/lander_sim

    volumes:
      - ./touchdown_ws:/workspace/touchdown_ws
      - ./CAD:/workspace/CAD

    privileged: true
    tty: true